<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>B站下载助手 - 合并下载</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f7f8;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        color: #18191c;
    }
    .card {
        width: 560px;
        max-width: 92vw;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 8px 32px rgba(0,0,0,.08);
        padding: 32px 36px;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    h1 .pink { color: #fb7299; }
    #filename {
        color: #9499a0;
        font-size: 13px;
        margin-bottom: 22px;
        word-break: break-all;
    }
    .step {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-top: 1px solid #f1f2f3;
    }
    .step .icon {
        width: 26px; height: 26px;
        flex-shrink: 0;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 14px;
        background: #f1f2f3;
        color: #9499a0;
    }
    .step.doing .icon { background: #ffe9f0; color: #fb7299; }
    .step.done  .icon { background: #e8f6ec; color: #2ac864; }
    .step.fail  .icon { background: #fdeced; color: #f05a5a; }
    .step .name { font-size: 15px; font-weight: 500; width: 110px; flex-shrink: 0; }
    .step .detail { flex: 1; font-size: 13px; color: #61666d; }
    .bar {
        height: 6px;
        background: #f1f2f3;
        border-radius: 3px;
        margin-top: 6px;
        overflow: hidden;
    }
    .bar i {
        display: block; height: 100%; width: 0;
        background: #fb7299;
        border-radius: 3px;
        transition: width .3s;
    }
    .bar.indet i {
        width: 35%;
        animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
        0% { margin-left: 0; } 100% { margin-left: 100%; }
    }
    #message {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.6;
        display: none;
        white-space: pre-wrap;
        word-break: break-all;
    }
    #message.warn { display: block; background: #fff8e6; color: #9a7b2c; }
    #message.error { display: block; background: #fdeced; color: #c9403f; }
    .actions { margin-top: 20px; text-align: right; }
    .btn {
        display: none;
        padding: 8px 22px;
        border: none;
        border-radius: 6px;
        background: #fb7299;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
    }
    .btn:hover { background: #ec5e8b; }
    .tip { margin-top: 16px; font-size: 12px; color: #9499a0; line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
    <h1><span class="pink">B站下载助手</span> · 浏览器内合并</h1>
    <div id="filename">正在读取任务…</div>
    <div class="step" id="st-video">
        <div class="icon">1</div><div class="name">下载视频流</div>
        <div class="detail">
            <span id="st-video-text">等待中</span>
            <div class="bar" id="st-video-bar"><i></i></div>
        </div>
    </div>
    <div class="step" id="st-audio">
        <div class="icon">2</div><div class="name">下载音频流</div>
        <div class="detail">
            <span id="st-audio-text">等待中</span>
            <div class="bar" id="st-audio-bar"><i></i></div>
        </div>
    </div>
    <div class="step" id="st-merge">
        <div class="icon">3</div><div class="name">无损合并</div>
        <div class="detail">
            <span id="st-merge-text">等待中</span>
            <div class="bar" id="st-merge-bar"><i></i></div>
        </div>
    </div>
    <div class="step" id="st-save">
        <div class="icon">4</div><div class="name">保存文件</div>
        <div class="detail">
            <span id="st-save-text">等待中</span>
            <div class="bar" id="st-save-bar"><i></i></div>
        </div>
    </div>
    <div id="message"></div>
    <div class="actions"><button class="btn" id="closeBtn">关 闭</button></div>
    <div class="tip">合并过程在浏览器内完成（视频越大耗时越长），期间请勿关闭本页面。<br>完成后自动保存到浏览器默认下载目录。</div>
</div>
<script src="libs/ffmpeg.js"></script>
<script src="merger.js"></script>
</body>
</html>
